<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HQ</title>
  <link rel="stylesheet" href="vendor/codicon.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="vendor/marked.umd.js"></script>
  <script src="render.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header id="topbar">
    <button id="toggle-sidebar" class="icon-btn" title="Sessions list (Ctrl+B)"><span class="codicon codicon-layout-sidebar-left"></span></button>
    <span id="profile" class="profile-tag hidden"></span>
    <div id="summary" class="summary"></div>
    <div class="spacer"></div>
    <button id="update" class="update-pill hidden">
      <span class="codicon codicon-cloud-download"></span><span class="update-text"></span>
    </button>
    <button id="usage" class="usage empty" title="Plan usage">
      <span class="codicon codicon-dashboard"></span><span class="usage-text">&hellip;</span>
    </button>
    <button id="resume-session" class="btn" title="Continue a session from VS Code or the terminal (Ctrl+O)">
      <span class="codicon codicon-history"></span> Resume
    </button>
    <button id="new-session" class="btn primary" title="New session (Ctrl+N)">
      <span class="codicon codicon-add"></span> New session
    </button>
  </header>

  <div id="workspace">
    <aside id="sidebar" class="hidden" aria-label="Sessions">
      <div class="sidebar-head">
        <span class="sidebar-title">Sessions</span>
        <span id="session-count" class="sidebar-count"></span>
      </div>
      <label class="sidebar-search">
        <span class="codicon codicon-search"></span>
        <input id="session-search" type="text" placeholder="Search sessions" spellcheck="false" autocomplete="off" />
      </label>
      <div id="session-list" class="session-list"></div>
      <div class="sidebar-foot">
        <span id="hq-version"></span>
        <button id="check-update" class="link-btn">Check for updates</button>
      </div>
    </aside>

    <main id="board">
      <div id="empty" class="empty">
        <div class="empty-title">No sessions yet</div>
        <div class="empty-sub">Each session runs Claude Code in its own folder, on any drive.</div>
        <button id="empty-new" class="btn primary"><span class="codicon codicon-add"></span> New session</button>
        <div class="empty-keys">Ctrl+N new &middot; Ctrl+O resume &middot; Ctrl+B sessions list &middot; Ctrl+1&hellip;9 focus &middot; Ctrl+M maximize &middot; Ctrl+Shift+M collapse &middot; F2 rename &middot; Esc stop</div>
      </div>
      <div id="grid"></div>
      <div id="dock" aria-label="Collapsed sessions"></div>
    </main>
  </div>

  <div id="picker" class="picker hidden" role="dialog" aria-label="New session">
    <div class="picker-title">New session in&hellip;</div>
    <div id="picker-recent" class="picker-list"></div>
    <button id="picker-browse" class="picker-item browse">
      <span class="codicon codicon-folder-opened"></span> Browse for a folder&hellip;
    </button>
  </div>

  <div id="resumer" class="picker resumer hidden" role="dialog" aria-label="Resume a session">
    <div class="picker-title">Continue a session</div>
    <label class="sidebar-search">
      <span class="codicon codicon-search"></span>
      <input id="resume-search" type="text" placeholder="Search by title, prompt or folder" spellcheck="false" autocomplete="off" />
    </label>
    <div id="resume-filters" class="filters">
      <button data-source="" class="on">All</button>
      <button data-source="claude-vscode">VS Code</button>
      <button data-source="cli">Terminal</button>
      <button data-source="sdk-cli">HQ</button>
      <button data-source="claude-desktop">Desktop</button>
      <select id="resume-project" title="Only sessions from this folder"><option value="">All folders</option></select>
    </div>
    <div id="resume-list" class="picker-list resume-list"></div>
  </div>

  <div id="usage-pop" class="usage-pop hidden" role="tooltip"></div>

  <div id="menu" class="menu hidden" role="menu"></div>

  <template id="cell-template">
    <section class="cell" tabindex="-1">
      <div class="cell-head">
        <span class="status-dot"></span>
        <span class="cell-project"><span class="proj-name"></span><span class="sweep" aria-hidden="true"><span class="sweep-name"></span></span></span>
        <span class="cell-title" title="Rename session (F2)"></span>
        <span class="cell-state"></span>
        <span class="cell-path"></span>
        <span class="bg-tasks hidden"><span class="codicon codicon-loading codicon-modifier-spin"></span><span class="bg-count"></span></span>
        <button class="icon-btn act-clean"><span class="codicon codicon-eye"></span></button>
        <button class="icon-btn act-progress"><span class="codicon codicon-checklist"></span></button>
        <button class="icon-btn act-code"><span class="codicon codicon-vscode"></span></button>
        <button class="icon-btn act-reveal" title="Open folder in Explorer"><span class="codicon codicon-folder"></span></button>
        <button class="icon-btn act-collapse"><span class="codicon codicon-chrome-minimize"></span></button>
        <button class="icon-btn act-max" title="Maximize (Ctrl+M)"><span class="codicon codicon-screen-full"></span></button>
        <button class="icon-btn act-close" title="Close session"><span class="codicon codicon-close"></span></button>
        <span class="head-progress hidden" aria-hidden="true"></span>
      </div>
      <div class="stage">
        <div class="messages"></div>
        <div class="progress-panel"></div>
      </div>
      <div class="prompts"></div>
      <div class="composer">
        <div class="busy" aria-hidden="true">
          <span class="busy-glyph"><span style="--i:0">&middot;</span><span style="--i:1">&#x2722;</span><span style="--i:2">&#x2733;&#xFE0E;</span><span style="--i:3">&#x2736;</span><span style="--i:4">&#x273B;</span><span style="--i:5">&#x273D;</span><span style="--i:6">&#x273B;</span><span style="--i:7">&#x2736;</span><span style="--i:8">&#x2733;&#xFE0E;</span><span style="--i:9">&#x2722;</span></span>
          <span class="busy-verb"><span class="busy-word"></span><span class="sweep"><span class="sweep-name busy-word"></span></span></span>
        </div>
        <div class="attachments"></div>
        <textarea rows="1" placeholder="Ask Claude…  (Enter to send, Shift+Enter for new line)"></textarea>
        <div class="composer-bar">
          <select class="mode" title="Permission mode">
            <option value="default">Ask before edits</option>
            <option value="acceptEdits">Edit automatically</option>
            <option value="plan">Plan mode</option>
            <option value="auto">Auto</option>
            <option value="bypassPermissions">Bypass permissions</option>
          </select>
          <button class="chip act-model" title="Model and effort"><span class="label"></span><span class="codicon codicon-chevron-down"></span></button>
          <button class="icon-btn act-mcp" title="MCP servers"><span class="codicon codicon-plug"></span></button>
          <button class="icon-btn act-attach" title="Attach images (you can also paste or drop them)"><span class="codicon codicon-file-media"></span></button>
          <input type="file" class="file-input hidden" accept="image/png,image/jpeg,image/gif,image/webp" multiple />
          <span class="spacer"></span>
          <span class="meta"></span>
          <button class="icon-btn act-stop hidden" title="Stop (Esc)"><span class="codicon codicon-debug-stop"></span></button>
          <button class="icon-btn act-send" title="Send (Enter)"><span class="codicon codicon-send"></span></button>
        </div>
      </div>
    </section>
  </template>
</body>
</html>
