[package]
name = "hq"
version = "0.6.0"
description = "Lightweight grid of Claude Code chat sessions across any folders"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Desktop toasts only fire and forget: the plugin has no click or action callback on Windows.
tauri-plugin-notification = "2"
# native-tls uses Windows' own TLS (smaller than rustls); zip is only for macOS/Linux bundles.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree through serde_json and tauri; used for fast byte searches in transcripts.
memchr = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# Transcript loading and search are byte-heavy; unoptimized, they are over 20x slower in a dev build.
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
