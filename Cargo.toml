[package]
name = "hq"
version = "0.19.2"
description = "Lightweight grid of Claude Code chat sessions across any folders"
edition = "2021"

[features]
default = ["hermes", "codex"]
# Hermes Agent cells (src/hermes.rs). Costs nothing at runtime until a Hermes cell starts.
hermes = []
# Codex cells (src/codex.rs). Costs nothing at runtime until a Codex cell starts.
codex = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Desktop toasts only fire and forget: the plugin has no click or action callback on Windows.
tauri-plugin-notification = "2"
# native-tls uses the system TLS (smaller than rustls). No zip: the Windows installer is a plain exe,
# and macOS updates are .app.tar.gz, read with flate2 and tar, which the plugin always builds there.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree through serde_json and tauri; used for fast byte searches in transcripts.
memchr = "2"
tauri-plugin-single-instance = "2"

# Process-group kills: the Unix counterpart of the Windows job object (src/session.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The API key lives in the login Keychain (src/secret.rs). Already in the tree through native-tls.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# Transcript loading and search are byte-heavy; unoptimized, they are over 20x slower in a dev build.
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
