[package]
name = "hq"
version = "0.38.0"
description = "Lightweight grid of Claude Code chat sessions across any folders"
edition = "2021"

[features]
default = ["hermes"]
# Hermes Agent cells (src/hermes.rs). Costs nothing at runtime until a Hermes cell starts.
# Also the Hermes rows of the token usage dashboard, read from Hermes' own SQLite file (src/usage/hermes.rs).
hermes = ["dep:rusqlite"]
# Codex cells (src/codex.rs). Off by default since 2026-11-05: Codex support is ending. Without it
# HQ refuses to start a Codex session and the UI offers none (`build_info` leaves it out).
codex = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Desktop toasts only fire and forget: the plugin has no click or action callback on Windows.
tauri-plugin-notification = "2"
# native-tls uses the system TLS (smaller than rustls). No zip: the Windows installer is a plain exe,
# and macOS updates are .app.tar.gz, read with flate2 and tar, which the plugin always builds there.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Cloud cells (src/cloud.rs) talk to Anthropic's Managed Agents API. Already in the tree through the updater, with the system TLS.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
# Already in the tree through serde_json and tauri; used for fast byte searches in transcripts.
memchr = "2"
tauri-plugin-single-instance = "2"
# The session host's handshake (host.rs). Already in the tree through tauri's build.
sha2 = "0.10"

# Hermes' state.db, opened read-only. No `bundled`: Windows links the OS's winsqlite3 (below) and
# macOS the system libsqlite3, so no C compiler runs and nothing is added to the binary. Stays on
# 0.30 because later releases dropped the `winsqlite3` feature.
rusqlite = { version = "0.30", default-features = false, optional = true }

# Process-group kills: the Unix counterpart of the Windows job object (src/session.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The API key lives in the login Keychain (src/secret.rs). Already in the tree through native-tls.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
# Approve and Deny buttons on prompt notifications (src/macos.rs). Already in the tree through the notification plugin.
mac-notification-sys = "0.6"

[target.'cfg(windows)'.dependencies]
# Points rusqlite at winsqlite3.dll, which ships with Windows 10 and later.
rusqlite = { version = "0.30", default-features = false, features = ["winsqlite3"], optional = true }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
] }

# Transcript loading and search are byte-heavy; unoptimized, they are over 20x slower in a dev build.
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
